<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Card Caller</title>
  <style>
    :root {
      --bg: #1a2332;
      --text: #f2f4f8;
      --muted: #9aa8bc;
      --accent: #3d8bfd;
      --accent-hover: #5a9dff;
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.4), 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(ellipse at top, #2a3a52 0%, transparent 55%),
        var(--bg);
      color: var(--text);
    }

    .app {
      width: min(100%, 420px);
      padding: 2rem 1.5rem;
      text-align: center;
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 0 0 1.75rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card-slot {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 320px;
      margin-bottom: 1.5rem;
    }

    .card {
      width: 200px;
      height: auto;
      border-radius: 10px;
      box-shadow: var(--shadow);
      display: block;
      user-select: none;
      background: #fff;
    }

    .card.placeholder {
      height: 280px;
      object-fit: cover;
      background: #0d2248;
    }

    .status {
      margin: 0 0 1.25rem;
      color: var(--muted);
      font-size: 0.95rem;
      min-height: 1.4em;
    }

    .status.empty {
      color: #f0c674;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 10px;
      padding: 0.75rem 1.35rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, opacity 0.15s ease, transform 0.1s ease;
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-draw {
      background: var(--accent);
      color: #fff;
      min-width: 140px;
    }

    .btn-draw:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-shuffle {
      background: transparent;
      color: var(--text);
      border: 1px solid #4a5d78;
    }

    .btn-shuffle:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .credit {
      margin-top: 1.75rem;
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Card Caller</h1>
    <p class="subtitle">Draw a random card from a shuffled deck</p>

    <div class="card-slot" id="cardSlot" aria-live="polite"></div>
    <p class="status" id="status"></p>

    <div class="actions">
      <button type="button" class="btn-draw" id="drawBtn">Draw card</button>
      <button type="button" class="btn-shuffle" id="shuffleBtn">Shuffle / Reset</button>
    </div>

    <p class="credit">Local modern SVG deck — works fully offline.</p>
  </main>

  <script>
    const SUITS = [
      { key: "heart", name: "hearts" },
      { key: "diamond", name: "diamonds" },
      { key: "club", name: "clubs" },
      { key: "spade", name: "spades" },
    ];
    const RANKS = [
      { key: "1", label: "A" },
      { key: "2", label: "2" },
      { key: "3", label: "3" },
      { key: "4", label: "4" },
      { key: "5", label: "5" },
      { key: "6", label: "6" },
      { key: "7", label: "7" },
      { key: "8", label: "8" },
      { key: "9", label: "9" },
      { key: "10", label: "10" },
      { key: "jack", label: "J" },
      { key: "queen", label: "Q" },
      { key: "king", label: "K" },
    ];

    const cardSlot = document.getElementById("cardSlot");
    const statusEl = document.getElementById("status");
    const drawBtn = document.getElementById("drawBtn");
    const shuffleBtn = document.getElementById("shuffleBtn");

    let deck = [];

    function cardSrc(suitKey, rankKey) {
      return `cards/${suitKey}_${rankKey}.svg`;
    }

    function buildDeck() {
      const cards = [];
      for (const suit of SUITS) {
        for (const rank of RANKS) {
          cards.push({
            suitKey: suit.key,
            suitName: suit.name,
            rankKey: rank.key,
            rankLabel: rank.label,
            src: cardSrc(suit.key, rank.key),
          });
        }
      }
      return cards;
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function renderPlaceholder() {
      cardSlot.innerHTML = `
        <img
          class="card placeholder"
          src="cards/back.svg"
          alt="Card back — click Draw card"
          width="200"
          height="280"
        />
      `;
    }

    function renderCard(card) {
      cardSlot.innerHTML = `
        <img
          class="card"
          src="${card.src}"
          alt="${card.rankLabel} of ${card.suitName}"
          width="200"
          height="280"
        />
      `;
    }

    function updateStatus() {
      const remaining = deck.length;
      statusEl.classList.toggle("empty", remaining === 0);

      if (remaining === 0) {
        statusEl.textContent = "Deck empty — shuffle to start again";
        drawBtn.disabled = true;
      } else {
        statusEl.textContent = `${remaining} card${remaining === 1 ? "" : "s"} left`;
        drawBtn.disabled = false;
      }
    }

    function resetDeck() {
      deck = shuffle(buildDeck());
      renderPlaceholder();
      updateStatus();
    }

    function drawCard() {
      if (deck.length === 0) return;
      const card = deck.pop();
      renderCard(card);
      updateStatus();
    }

    drawBtn.addEventListener("click", drawCard);
    shuffleBtn.addEventListener("click", resetDeck);

    resetDeck();
  </script>
</body>
</html>
